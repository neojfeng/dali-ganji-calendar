<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>大理赶集日历</title>
    <meta
      name="description"
      content="选择你关注的大理集市，订阅到 iPhone 日历。"
    >
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f8f7;
        --text: #1f2428;
        --muted: #5f686f;
        --line: #d8e0dd;
        --panel: #ffffff;
        --panel-strong: #eef6f3;
        --accent: #0f766e;
        --accent-strong: #0a5d57;
        --warn: #9a5b10;
        --shadow: 0 -10px 30px rgba(31, 36, 40, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.55;
      }

      main {
        width: min(760px, 100%);
        margin: 0 auto;
        padding: 28px 16px 196px;
      }

      .hero {
        padding: 8px 0 18px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 34px;
        line-height: 1.12;
        letter-spacing: 0;
      }

      .lead {
        margin: 0;
        color: var(--muted);
        font-size: 17px;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border-top: 1px solid var(--line);
        padding: 18px 0 12px;
      }

      h2 {
        margin: 0;
        font-size: 18px;
        letter-spacing: 0;
      }

      .toolbar-actions {
        display: flex;
        gap: 8px;
      }

      .text-button {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--text);
        padding: 7px 10px;
        font: inherit;
        font-weight: 700;
      }

      .market-list {
        display: grid;
        gap: 10px;
      }

      .market-card {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 12px;
        align-items: start;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 14px;
      }

      .market-card:has(input:checked) {
        border-color: rgba(15, 118, 110, 0.72);
        background: var(--panel-strong);
      }

      input[type="checkbox"] {
        width: 22px;
        height: 22px;
        margin: 2px 0 0;
        accent-color: var(--accent);
      }

      .market-name {
        display: block;
        font-size: 17px;
        font-weight: 800;
        line-height: 1.25;
      }

      .market-intro {
        margin: 6px 0 9px;
        color: var(--muted);
        font-size: 14px;
      }

      .market-meta {
        display: grid;
        gap: 4px;
        color: #394249;
        font-size: 14px;
      }

      .empty,
      .status {
        color: var(--muted);
        font-size: 14px;
      }

      .empty {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 16px;
      }

      .subscribe-panel {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 10;
        border-top: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.96);
        box-shadow: var(--shadow);
        backdrop-filter: blur(16px);
      }

      .subscribe-inner {
        width: min(760px, 100%);
        margin: 0 auto;
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      }

      .selected-count {
        margin: 0 0 10px;
        font-weight: 800;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      button {
        min-height: 48px;
        border: 0;
        border-radius: 8px;
        padding: 0 12px;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }

      .primary {
        background: var(--accent);
        color: #fff;
      }

      .primary:enabled:active,
      .primary:enabled:hover {
        background: var(--accent-strong);
      }

      .secondary {
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--text);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      .link-box {
        display: grid;
        gap: 8px;
        margin-top: 10px;
      }

      .link-box input {
        width: 100%;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f1f4f3;
        color: var(--text);
        font: inherit;
        font-size: 13px;
        padding: 10px 11px;
      }

      .hint {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .hint.warning {
        color: var(--warn);
      }

      @media (min-width: 700px) {
        main {
          padding-top: 44px;
          padding-bottom: 184px;
        }

        h1 {
          font-size: 46px;
        }

        .market-list {
          grid-template-columns: 1fr 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <h1>大理赶集日历</h1>
        <p class="lead">选择你关注的集市，订阅到 iPhone 日历</p>
      </section>

      <section aria-labelledby="marketsTitle">
        <div class="toolbar">
          <h2 id="marketsTitle">选择集市</h2>
          <div class="toolbar-actions">
            <button class="text-button" id="selectAllButton" type="button">全选</button>
            <button class="text-button" id="clearButton" type="button">清空</button>
          </div>
        </div>
        <div class="market-list" id="marketList">
          <p class="empty">正在加载集市...</p>
        </div>
      </section>
    </main>

    <section class="subscribe-panel" aria-label="订阅操作">
      <div class="subscribe-inner">
        <p class="selected-count" id="selectedCount">已选择 0 个集市</p>
        <div class="actions">
          <button class="primary" id="subscribeButton" type="button" disabled>一键订阅 Apple 日历</button>
          <button class="secondary" id="copyButton" type="button" disabled>复制订阅链接</button>
        </div>
        <div class="link-box">
          <input id="httpsLink" type="text" readonly value="请先选择你关注的集市" aria-label="HTTPS 订阅链接">
        </div>
        <p class="hint warning" id="emptyHint">请先选择你关注的集市</p>
        <p class="hint">如果小红书或微信里没有唤起日历，请复制链接，然后到 iPhone 日历里手动添加订阅日历。</p>
        <p class="status" id="copyStatus" role="status" aria-live="polite"></p>
      </div>
    </section>

    <script>
      const STORAGE_KEY = "dali-ganji-selected-markets";
      const marketList = document.querySelector("#marketList");
      const selectedCount = document.querySelector("#selectedCount");
      const subscribeButton = document.querySelector("#subscribeButton");
      const copyButton = document.querySelector("#copyButton");
      const httpsInput = document.querySelector("#httpsLink");
      const emptyHint = document.querySelector("#emptyHint");
      const copyStatus = document.querySelector("#copyStatus");
      const selectAllButton = document.querySelector("#selectAllButton");
      const clearButton = document.querySelector("#clearButton");

      let markets = [];
      let selected = new Set();

      init();

      async function init() {
        try {
          const response = await fetch(new URL("markets.json", window.location.href), { cache: "no-store" });
          if (!response.ok) throw new Error("markets.json load failed");
          markets = await response.json();
          selected = restoreSelection(markets);
          renderMarkets();
          updateSubscription();
        } catch (error) {
          marketList.innerHTML = '<p class="empty">集市列表加载失败，请稍后再试。</p>';
        }
      }

      function restoreSelection(allMarkets) {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
          const validIds = new Set(allMarkets.map((market) => market.id));
          return new Set(saved.filter((id) => validIds.has(id)));
        } catch (error) {
          return new Set();
        }
      }

      function renderMarkets() {
        marketList.innerHTML = "";
        const fragment = document.createDocumentFragment();

        for (const market of markets) {
          const card = document.createElement("label");
          card.className = "market-card";
          card.innerHTML = `
            <input type="checkbox" value="${escapeHtml(market.id)}" ${selected.has(market.id) ? "checked" : ""}>
            <span>
              <span class="market-name">${escapeHtml(market.name)}</span>
              <span class="market-intro">${escapeHtml(market.intro || "简介待补充。")}</span>
              <span class="market-meta">
                <span>时间：${escapeHtml(market.schedule_text || "待补充")}</span>
                <span>地点：${escapeHtml(market.address || market.location_name || "待补充")}</span>
              </span>
            </span>
          `;
          card.querySelector("input").addEventListener("change", (event) => {
            if (event.target.checked) {
              selected.add(market.id);
            } else {
              selected.delete(market.id);
            }
            saveSelection();
            updateSubscription();
          });
          fragment.appendChild(card);
        }

        marketList.appendChild(fragment);
      }

      function updateSubscription() {
        const ids = selectedIdsInMarketOrder();
        const hasSelection = ids.length > 0;
        const httpsUrl = hasSelection ? subscriptionUrl(ids, "https") : "";
        const webcalUrl = hasSelection ? subscriptionUrl(ids, "webcal") : "";

        selectedCount.textContent = `已选择 ${ids.length} 个集市`;
        subscribeButton.disabled = !hasSelection;
        copyButton.disabled = !hasSelection;
        emptyHint.hidden = hasSelection;
        httpsInput.value = hasSelection ? httpsUrl : "请先选择你关注的集市";
        httpsInput.dataset.url = httpsUrl;
        subscribeButton.dataset.url = webcalUrl;
        copyStatus.textContent = "";
      }

      function selectedIdsInMarketOrder() {
        return markets.filter((market) => selected.has(market.id)).map((market) => market.id);
      }

      function subscriptionUrl(ids, protocol) {
        const baseUrl = window.location.protocol === "file:" ? "http://localhost:3000" : window.location.origin;
        const url = new URL("/api/calendar.ics", baseUrl);
        url.searchParams.set("markets", ids.join(","));
        if (protocol === "webcal") {
          return url.href.replace(/^https?:\/\//, "webcal://");
        }
        return url.href;
      }

      function saveSelection() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(selectedIdsInMarketOrder()));
        } catch (error) {
          return;
        }
      }

      subscribeButton.addEventListener("click", () => {
        const url = subscribeButton.dataset.url;
        if (url) window.location.href = url;
      });

      copyButton.addEventListener("click", async () => {
        const url = httpsInput.dataset.url;
        if (!url) return;
        try {
          await navigator.clipboard.writeText(url);
          copyStatus.textContent = "已复制订阅链接。";
        } catch (error) {
          httpsInput.focus();
          httpsInput.select();
          copyStatus.textContent = "请手动复制输入框里的链接。";
        }
      });

      selectAllButton.addEventListener("click", () => {
        selected = new Set(markets.map((market) => market.id));
        saveSelection();
        renderMarkets();
        updateSubscription();
      });

      clearButton.addEventListener("click", () => {
        selected.clear();
        saveSelection();
        renderMarkets();
        updateSubscription();
      });

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
    </script>
  </body>
</html>
