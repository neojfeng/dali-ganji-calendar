<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>大理赶集日历</title>
    <meta
      name="description"
      content="选择你常去的大理集市，订阅到 iPhone 日历，到点自动提醒。"
    >
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f3ef;
        --bg-soft: #ebe7df;
        --text: #1d1d1f;
        --muted: #6e6e73;
        --subtle: #8a8a90;
        --panel: rgba(255, 255, 255, 0.82);
        --panel-solid: #ffffff;
        --line: rgba(29, 29, 31, 0.09);
        --accent: #0a84ff;
        --accent-strong: #006edb;
        --selected: #eff7ff;
        --warning: #936006;
        --shadow-soft: 0 18px 55px rgba(52, 48, 43, 0.10);
        --shadow-card: 0 18px 44px rgba(52, 48, 43, 0.12);
        --radius-xl: 28px;
        --radius-lg: 22px;
        --radius-md: 16px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 20% -10%, rgba(255, 255, 255, 0.96), transparent 32rem),
          linear-gradient(180deg, #f9f7f3 0%, var(--bg) 46%, var(--bg-soft) 100%);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
        line-height: 1.58;
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      main {
        width: min(1080px, 100%);
        margin: 0 auto;
        padding: 26px 18px 210px;
      }

      .hero {
        display: grid;
        gap: 22px;
        min-height: 360px;
        align-content: center;
        padding: 28px 0 34px;
      }

      .eyebrow {
        margin: 0;
        color: var(--accent);
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.04em;
      }

      h1 {
        max-width: 760px;
        margin: 0;
        font-size: clamp(42px, 12vw, 88px);
        line-height: 0.98;
        letter-spacing: 0;
      }

      .lead {
        max-width: 650px;
        margin: 0;
        color: var(--muted);
        font-size: clamp(18px, 4.5vw, 26px);
        line-height: 1.38;
      }

      .hero-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }

      .pill-button {
        min-height: 48px;
        border: 0;
        border-radius: 999px;
        padding: 0 18px;
        background: var(--text);
        color: #fff;
        font-weight: 800;
        box-shadow: 0 12px 24px rgba(29, 29, 31, 0.14);
        transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
      }

      .pill-button:hover {
        transform: translateY(-1px);
        box-shadow: 0 16px 30px rgba(29, 29, 31, 0.18);
      }

      .pill-button:active {
        transform: translateY(1px) scale(0.99);
      }

      .privacy-note {
        max-width: 320px;
        margin: 0;
        color: var(--subtle);
        font-size: 13px;
        line-height: 1.45;
      }

      .status {
        min-height: 20px;
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }

      .status.warning {
        color: var(--warning);
      }

      .section-head {
        display: grid;
        gap: 8px;
        margin: 4px 0 18px;
      }

      h2 {
        margin: 0;
        font-size: clamp(27px, 7vw, 44px);
        line-height: 1.08;
        letter-spacing: 0;
      }

      .section-copy {
        margin: 0;
        color: var(--muted);
        font-size: 16px;
      }

      .market-grid {
        display: grid;
        gap: 18px;
      }

      .market-card {
        position: relative;
        overflow: hidden;
        border: 0;
        border-radius: var(--radius-xl);
        background: var(--panel);
        box-shadow: var(--shadow-soft);
        text-align: left;
        transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      .market-card:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-card);
      }

      .market-card:active {
        transform: translateY(0) scale(0.995);
      }

      .market-card.is-selected {
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.94), var(--selected));
        box-shadow: 0 20px 56px rgba(10, 132, 255, 0.16);
      }

      .market-card.is-selected::after {
        position: absolute;
        inset: 0;
        pointer-events: none;
        border: 2px solid rgba(10, 132, 255, 0.34);
        border-radius: var(--radius-xl);
        content: "";
      }

      .card-image-wrap {
        position: relative;
        aspect-ratio: 16 / 10;
        overflow: hidden;
        background: #e7e3da;
      }

      .card-image {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        transition: transform 500ms ease;
      }

      .market-card:hover .card-image {
        transform: scale(1.025);
      }

      .check-mark {
        position: absolute;
        top: 16px;
        right: 16px;
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.84);
        color: rgba(29, 29, 31, 0.42);
        font-size: 18px;
        font-weight: 900;
        box-shadow: 0 8px 22px rgba(29, 29, 31, 0.13);
        backdrop-filter: blur(14px);
      }

      .market-card.is-selected .check-mark {
        background: var(--accent);
        color: #fff;
      }

      .card-body {
        display: grid;
        gap: 12px;
        padding: 18px 18px 20px;
      }

      .card-topline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .distance {
        color: var(--muted);
        font-size: 13px;
        font-weight: 800;
        white-space: nowrap;
      }

      .market-name {
        margin: 0;
        font-size: 24px;
        line-height: 1.15;
        letter-spacing: 0;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .chip {
        border-radius: 999px;
        background: rgba(29, 29, 31, 0.06);
        color: #3b3b3f;
        padding: 7px 10px;
        font-size: 13px;
        font-weight: 700;
      }

      .intro {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
      }

      .empty {
        border-radius: var(--radius-lg);
        background: var(--panel-solid);
        box-shadow: var(--shadow-soft);
        color: var(--muted);
        padding: 24px;
      }

      .subscribe-sheet {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 20;
        padding: 0 12px 12px;
        pointer-events: none;
      }

      .sheet-inner {
        width: min(720px, 100%);
        margin: 0 auto;
        border: 1px solid rgba(255, 255, 255, 0.42);
        border-radius: 26px;
        background: rgba(255, 255, 255, 0.86);
        box-shadow: 0 -18px 58px rgba(29, 29, 31, 0.18);
        padding: 14px 14px calc(14px + env(safe-area-inset-bottom));
        pointer-events: auto;
        backdrop-filter: blur(22px);
      }

      .sheet-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 12px;
      }

      .selected-count {
        margin: 0;
        font-size: 17px;
        font-weight: 900;
      }

      .sheet-note {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 12px;
      }

      .sheet-actions {
        display: grid;
        grid-template-columns: 1.25fr 0.95fr;
        gap: 10px;
      }

      .sheet-button {
        min-height: 50px;
        border: 0;
        border-radius: 16px;
        padding: 0 12px;
        font-weight: 900;
        transition: transform 150ms ease, background 150ms ease, opacity 150ms ease;
      }

      .sheet-button:active {
        transform: scale(0.985);
      }

      .sheet-button.primary {
        background: var(--accent);
        color: #fff;
      }

      .sheet-button.primary:enabled:hover {
        background: var(--accent-strong);
      }

      .sheet-button.secondary {
        background: rgba(29, 29, 31, 0.07);
        color: var(--text);
      }

      .sheet-button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      .link-row {
        display: grid;
        margin-top: 10px;
      }

      .link-row input {
        width: 100%;
        min-width: 0;
        border: 0;
        border-radius: 14px;
        background: rgba(29, 29, 31, 0.06);
        color: var(--muted);
        font-size: 12px;
        padding: 10px 12px;
      }

      .copy-status {
        min-height: 18px;
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 12px;
      }

      @media (min-width: 720px) {
        main {
          padding: 34px 28px 220px;
        }

        .hero {
          min-height: 460px;
        }

        .market-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 22px;
        }
      }

      @media (min-width: 1040px) {
        .market-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      @media (max-width: 390px) {
        main {
          padding-right: 14px;
          padding-left: 14px;
        }

        .sheet-actions {
          grid-template-columns: 1fr;
        }

        .market-name {
          font-size: 22px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero" aria-labelledby="pageTitle">
        <div>
          <p class="eyebrow">DALI LOCAL MARKETS</p>
          <h1 id="pageTitle">大理赶集日历</h1>
        </div>
        <p class="lead">选几个你常去的集市，订阅到 iPhone 日历，到点自动提醒。</p>
        <div class="hero-actions">
          <button class="pill-button" id="locationButton" type="button">使用我的位置推荐附近集市</button>
          <p class="privacy-note">定位只在本地用于计算距离，不会保存。</p>
        </div>
        <p class="status" id="locationStatus" role="status" aria-live="polite"></p>
      </section>

      <section aria-labelledby="marketsTitle">
        <div class="section-head">
          <h2 id="marketsTitle">选择你的集市</h2>
          <p class="section-copy">点一下卡片即可选择，再点一次取消。</p>
        </div>

        <div class="market-grid" id="marketGrid">
          <div class="empty">正在加载集市...</div>
        </div>
      </section>
    </main>

    <section class="subscribe-sheet" aria-label="订阅操作">
      <div class="sheet-inner">
        <div class="sheet-head">
          <div>
            <p class="selected-count" id="selectedCount">选择你关注的集市</p>
            <p class="sheet-note" id="sheetNote">生成只包含这些集市的 Apple 日历。</p>
          </div>
        </div>
        <div class="sheet-actions">
          <button class="sheet-button primary" id="subscribeButton" type="button" disabled>一键订阅 Apple 日历</button>
          <button class="sheet-button secondary" id="copyButton" type="button" disabled>复制订阅链接</button>
        </div>
        <div class="link-row">
          <input id="httpsLink" type="text" readonly value="先选择一个集市" aria-label="HTTPS 订阅链接">
        </div>
        <p class="copy-status" id="copyStatus" role="status" aria-live="polite">
          小红书或微信打不开时，复制链接到 iPhone 日历里手动添加订阅。
        </p>
      </div>
    </section>

    <script>
      const STORAGE_KEY = "dali-ganji-selected-markets";
      const PLACEHOLDER_IMAGE = "/images/markets/placeholder.jpg";

      const marketGrid = document.querySelector("#marketGrid");
      const locationButton = document.querySelector("#locationButton");
      const locationStatus = document.querySelector("#locationStatus");
      const selectedCount = document.querySelector("#selectedCount");
      const sheetNote = document.querySelector("#sheetNote");
      const subscribeButton = document.querySelector("#subscribeButton");
      const copyButton = document.querySelector("#copyButton");
      const httpsInput = document.querySelector("#httpsLink");
      const copyStatus = document.querySelector("#copyStatus");

      let markets = [];
      let selected = new Set();
      let hasLocation = false;

      init();

      async function init() {
        try {
          const response = await fetch(new URL("markets.json", window.location.href), { cache: "no-store" });
          if (!response.ok) throw new Error("markets.json load failed");
          markets = await response.json();
          selected = restoreSelection(markets);
          renderMarkets();
          updateSubscription();
        } catch (error) {
          marketGrid.innerHTML = '<div class="empty">集市列表加载失败，请稍后再试。</div>';
        }
      }

      function restoreSelection(allMarkets) {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
          const validIds = new Set(allMarkets.map((market) => market.id));
          return new Set(saved.filter((id) => validIds.has(id)));
        } catch (error) {
          return new Set();
        }
      }

      function renderMarkets() {
        const visibleMarkets = sortedMarkets();
        marketGrid.innerHTML = "";

        if (visibleMarkets.length === 0) {
          marketGrid.innerHTML = '<div class="empty">暂时没有可显示的集市。</div>';
          return;
        }

        const fragment = document.createDocumentFragment();
        for (const market of visibleMarkets) {
          const isSelected = selected.has(market.id);
          const card = document.createElement("article");
          card.className = `market-card${isSelected ? " is-selected" : ""}`;
          card.setAttribute("role", "button");
          card.setAttribute("tabindex", "0");
          card.setAttribute("aria-pressed", isSelected ? "true" : "false");
          card.innerHTML = cardTemplate(market, isSelected);
          card.addEventListener("click", () => toggleMarket(market.id));
          card.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              toggleMarket(market.id);
            }
          });
          fragment.appendChild(card);
        }
        marketGrid.appendChild(fragment);
      }

      function cardTemplate(market, isSelected) {
        const distance = market.distanceKm !== undefined ? formatDistance(market.distanceKm) : "";
        return `
          <div class="card-image-wrap">
            <img
              class="card-image"
              src="${escapeHtml(market.image || PLACEHOLDER_IMAGE)}"
              alt="${escapeHtml(market.image_alt || market.name)}"
              loading="lazy"
              onerror="this.onerror=null;this.src='${PLACEHOLDER_IMAGE}'"
            >
            <span class="check-mark" aria-hidden="true">${isSelected ? "✓" : ""}</span>
          </div>
          <div class="card-body">
            ${distance ? `<div class="card-topline"><span class="distance">${escapeHtml(distance)}</span></div>` : ""}
            <h3 class="market-name">${escapeHtml(market.name)}</h3>
            <div class="chips">
              <span class="chip">${escapeHtml(trimScheduleText(market.schedule_text || "时间待补充"))}</span>
              <span class="chip">${escapeHtml(market.location_name || market.address || "地点待补充")}</span>
            </div>
            <p class="intro">${escapeHtml(market.intro || "简介待补充。")}</p>
          </div>
        `;
      }

      function sortedMarkets() {
        let result = markets.slice();
        if (hasLocation) {
          result.sort((a, b) => {
            const da = a.distanceKm ?? Number.POSITIVE_INFINITY;
            const db = b.distanceKm ?? Number.POSITIVE_INFINITY;
            if (da !== db) return da - db;
            return Number(a.order || 0) - Number(b.order || 0);
          });
        } else {
          result.sort((a, b) => Number(a.order || 0) - Number(b.order || 0));
        }
        return result;
      }

      function toggleMarket(marketId) {
        if (selected.has(marketId)) {
          selected.delete(marketId);
        } else {
          selected.add(marketId);
        }
        saveSelection();
        renderMarkets();
        updateSubscription();
      }

      function updateSubscription() {
        const ids = selectedIdsInMarketOrder();
        const hasSelection = ids.length > 0;
        const httpsUrl = hasSelection ? subscriptionUrl(ids, "https") : "";
        const webcalUrl = hasSelection ? subscriptionUrl(ids, "webcal") : "";

        selectedCount.textContent = hasSelection ? `已选择 ${ids.length} 个集市` : "选择你关注的集市";
        sheetNote.textContent = hasSelection ? "会生成只包含这些集市的订阅日历。" : "点选上方卡片后即可订阅。";
        subscribeButton.disabled = !hasSelection;
        copyButton.disabled = !hasSelection;
        httpsInput.value = hasSelection ? httpsUrl : "先选择一个集市";
        httpsInput.dataset.url = httpsUrl;
        subscribeButton.dataset.url = webcalUrl;
      }

      function selectedIdsInMarketOrder() {
        return markets.filter((market) => selected.has(market.id)).map((market) => market.id);
      }

      function subscriptionUrl(ids, protocol) {
        const baseUrl = window.location.protocol === "file:" ? "http://localhost:3000" : window.location.origin;
        const url = new URL("/api/calendar.ics", baseUrl);
        url.searchParams.set("markets", ids.join(","));
        return protocol === "webcal" ? url.href.replace(/^https?:\/\//, "webcal://") : url.href;
      }

      function saveSelection() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(selectedIdsInMarketOrder()));
        } catch (error) {
          return;
        }
      }

      locationButton.addEventListener("click", async () => {
        locationButton.disabled = true;
        locationStatus.textContent = "正在获取你的位置...";
        locationStatus.classList.remove("warning");
        try {
          const position = await getUserLocation();
          const userLat = position.coords.latitude;
          const userLng = position.coords.longitude;
          markets = markets.map((market) => {
            if (!hasCoordinates(market)) return market;
            return {
              ...market,
              distanceKm: calculateDistanceKm(userLat, userLng, Number(market.lat), Number(market.lng)),
            };
          });
          hasLocation = true;
          locationStatus.textContent = "已按距离为你排序。";
          renderMarkets();
        } catch (error) {
          locationStatus.textContent = "无法获取位置，你仍然可以手动选择。";
          locationStatus.classList.add("warning");
        } finally {
          locationButton.disabled = false;
        }
      });

      subscribeButton.addEventListener("click", () => {
        const url = subscribeButton.dataset.url;
        if (url) window.location.href = url;
      });

      copyButton.addEventListener("click", async () => {
        const url = httpsInput.dataset.url;
        if (!url) return;
        try {
          await navigator.clipboard.writeText(url);
          copyStatus.textContent = "已复制订阅链接。";
        } catch (error) {
          httpsInput.focus();
          httpsInput.select();
          copyStatus.textContent = "请手动复制输入框里的链接。";
        }
      });

      function getUserLocation() {
        return new Promise((resolve, reject) => {
          if (!navigator.geolocation) {
            reject(new Error("Geolocation is not supported."));
            return;
          }
          navigator.geolocation.getCurrentPosition(resolve, reject, {
            enableHighAccuracy: false,
            timeout: 10000,
            maximumAge: 300000,
          });
        });
      }

      function calculateDistanceKm(lat1, lng1, lat2, lng2) {
        const earthRadiusKm = 6371;
        const dLat = toRadians(lat2 - lat1);
        const dLng = toRadians(lng2 - lng1);
        const a =
          Math.sin(dLat / 2) * Math.sin(dLat / 2) +
          Math.cos(toRadians(lat1)) *
            Math.cos(toRadians(lat2)) *
            Math.sin(dLng / 2) *
            Math.sin(dLng / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return earthRadiusKm * c;
      }

      function formatDistance(distanceKm) {
        if (!Number.isFinite(distanceKm)) return "";
        if (distanceKm < 1) return `距你 ${Math.round(distanceKm * 1000)} m`;
        return `距你 ${distanceKm.toFixed(1)} km`;
      }

      function hasCoordinates(market) {
        return market.lat !== null && market.lat !== undefined && market.lng !== null && market.lng !== undefined;
      }

      function toRadians(value) {
        return (value * Math.PI) / 180;
      }

      function trimScheduleText(value) {
        return String(value).replace(/赶集$/, "");
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
    </script>
  </body>
</html>
