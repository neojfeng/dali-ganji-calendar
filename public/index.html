<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>大理赶集日历</title>
    <meta name="description" content="选择你常去的大理集市，订阅到 iPhone 日历。">
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f3ef;
        --surface: rgba(255, 255, 255, 0.78);
        --surface-solid: #fff;
        --text: #1d1d1f;
        --muted: #6e6e73;
        --subtle: #8f8f95;
        --line: rgba(29, 29, 31, 0.08);
        --chip: rgba(255, 255, 255, 0.78);
        --accent: #0a84ff;
        --accent-soft: #edf6ff;
        --warning: #936006;
        --shadow-card: 0 8px 28px rgba(40, 36, 32, 0.08);
        --shadow-selected: 0 12px 34px rgba(10, 132, 255, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 18% -8%, rgba(255, 255, 255, 0.95), transparent 22rem),
          linear-gradient(180deg, #fbfaf7 0%, var(--bg) 52%, #ece7de 100%);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
        line-height: 1.5;
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      main {
        width: min(920px, 100%);
        margin: 0 auto;
        padding: 16px 14px 96px;
      }

      .hero {
        display: grid;
        gap: 10px;
        min-height: 154px;
        align-content: center;
        padding: 8px 2px 10px;
      }

      h1 {
        margin: 0;
        font-size: clamp(32px, 9vw, 44px);
        line-height: 1.05;
        letter-spacing: 0;
      }

      .lead {
        margin: 0;
        color: var(--muted);
        font-size: 16px;
      }

      .location-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .location-button {
        min-height: 36px;
        border: 0;
        border-radius: 999px;
        padding: 0 13px;
        background: #1d1d1f;
        color: #fff;
        font-size: 14px;
        font-weight: 800;
        box-shadow: 0 8px 20px rgba(29, 29, 31, 0.14);
        transition: transform 150ms ease, background 150ms ease, opacity 150ms ease;
      }

      .location-button:active {
        transform: scale(0.98);
      }

      .location-button:disabled {
        opacity: 0.62;
      }

      .privacy-note {
        margin: 0;
        color: var(--subtle);
        font-size: 12px;
      }

      .filters {
        display: flex;
        gap: 8px;
        margin: 0 -14px 12px;
        padding: 0 14px 2px;
        overflow-x: auto;
        scrollbar-width: none;
      }

      .filters::-webkit-scrollbar {
        display: none;
      }

      .filter-chip {
        flex: 0 0 auto;
        min-height: 36px;
        border: 0;
        border-radius: 999px;
        padding: 0 14px;
        background: var(--chip);
        color: var(--text);
        font-size: 14px;
        font-weight: 800;
        box-shadow: inset 0 0 0 1px var(--line);
        backdrop-filter: blur(16px);
        transition: background 150ms ease, color 150ms ease, box-shadow 150ms ease;
      }

      .filter-chip.is-active {
        background: #1d1d1f;
        color: #fff;
        box-shadow: none;
      }

      .market-list {
        display: grid;
        gap: 10px;
      }

      .market-card {
        position: relative;
        display: grid;
        grid-template-columns: 80px minmax(0, 1fr) 32px;
        gap: 12px;
        align-items: center;
        border: 0;
        border-radius: 22px;
        background: var(--surface);
        box-shadow: var(--shadow-card);
        padding: 10px;
        text-align: left;
        backdrop-filter: blur(20px);
        transition: transform 150ms ease, background 150ms ease, box-shadow 150ms ease;
      }

      .market-card:active {
        transform: scale(0.992);
      }

      .market-card.is-selected {
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), var(--accent-soft));
        box-shadow: var(--shadow-selected);
      }

      .thumb {
        width: 80px;
        height: 80px;
        overflow: hidden;
        border-radius: 16px;
        background: #e7e3da;
      }

      .thumb img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }

      .card-content {
        min-width: 0;
      }

      .card-title-row {
        display: flex;
        gap: 8px;
        align-items: baseline;
        justify-content: space-between;
      }

      .market-name {
        margin: 0;
        overflow: hidden;
        font-size: 17px;
        font-weight: 900;
        line-height: 1.2;
        letter-spacing: 0;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .meta {
        margin: 3px 0 0;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .rule,
      .place {
        margin: 3px 0 0;
        overflow: hidden;
        color: #3d3d42;
        font-size: 13px;
        line-height: 1.28;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .place {
        color: var(--muted);
      }

      .select-mark {
        display: grid;
        width: 28px;
        height: 28px;
        place-items: center;
        border-radius: 50%;
        background: rgba(29, 29, 31, 0.07);
        color: #4d4d52;
        font-size: 20px;
        font-weight: 800;
      }

      .market-card.is-selected .select-mark {
        background: var(--accent);
        color: #fff;
        font-size: 17px;
      }

      .empty {
        border-radius: 20px;
        background: var(--surface-solid);
        box-shadow: var(--shadow-card);
        color: var(--muted);
        padding: 18px;
      }

      .toast {
        position: fixed;
        top: calc(12px + env(safe-area-inset-top));
        left: 50%;
        z-index: 40;
        max-width: min(320px, calc(100% - 28px));
        border-radius: 999px;
        background: rgba(29, 29, 31, 0.88);
        color: #fff;
        box-shadow: 0 12px 32px rgba(29, 29, 31, 0.18);
        font-size: 13px;
        font-weight: 800;
        opacity: 0;
        padding: 10px 14px;
        pointer-events: none;
        transform: translate(-50%, -12px);
        transition: opacity 180ms ease, transform 180ms ease;
        backdrop-filter: blur(18px);
      }

      .toast.is-visible {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      .bottom-bar,
      .subscribe-panel {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 30;
        padding: 0 12px calc(10px + env(safe-area-inset-bottom));
        pointer-events: none;
      }

      .bottom-bar[hidden],
      .subscribe-panel[hidden] {
        display: none;
      }

      .bar-inner,
      .panel-inner {
        width: min(720px, 100%);
        margin: 0 auto;
        pointer-events: auto;
        border: 1px solid rgba(255, 255, 255, 0.45);
        background: rgba(255, 255, 255, 0.88);
        box-shadow: 0 -12px 36px rgba(29, 29, 31, 0.16);
        backdrop-filter: blur(22px);
      }

      .bar-inner {
        display: flex;
        min-height: 66px;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border-radius: 22px;
        padding: 10px 12px 10px 16px;
      }

      .bar-count {
        margin: 0;
        font-size: 16px;
        font-weight: 900;
      }

      .bar-sub {
        margin: 1px 0 0;
        color: var(--muted);
        font-size: 12px;
      }

      .subscribe-toggle,
      .panel-button {
        min-height: 44px;
        border: 0;
        border-radius: 15px;
        font-weight: 900;
        transition: transform 150ms ease, background 150ms ease;
      }

      .subscribe-toggle {
        min-width: 86px;
        background: var(--accent);
        color: #fff;
      }

      .subscribe-toggle:active,
      .panel-button:active {
        transform: scale(0.98);
      }

      .panel-inner {
        border-radius: 24px;
        padding: 14px;
      }

      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      .panel-title {
        margin: 0;
        font-size: 17px;
        font-weight: 900;
      }

      .panel-close {
        width: 34px;
        height: 34px;
        border: 0;
        border-radius: 50%;
        background: rgba(29, 29, 31, 0.07);
        color: var(--text);
        font-size: 20px;
      }

      .panel-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .panel-button.primary {
        background: var(--accent);
        color: #fff;
      }

      .panel-button.secondary {
        background: rgba(29, 29, 31, 0.07);
        color: var(--text);
      }

      .link-row {
        margin-top: 10px;
      }

      .link-row input {
        width: 100%;
        min-width: 0;
        border: 0;
        border-radius: 14px;
        background: rgba(29, 29, 31, 0.06);
        color: var(--muted);
        font-size: 12px;
        padding: 10px 12px;
      }

      .panel-help {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 12px;
      }

      @media (min-width: 720px) {
        main {
          padding: 22px 22px 112px;
        }

        .market-list {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 12px;
        }
      }

      @media (max-width: 360px) {
        main {
          padding-right: 12px;
          padding-left: 12px;
        }

        .market-card {
          grid-template-columns: 72px minmax(0, 1fr) 30px;
        }

        .thumb {
          width: 72px;
          height: 72px;
        }

        .panel-actions {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero" aria-labelledby="pageTitle">
        <h1 id="pageTitle">大理赶集日历</h1>
        <p class="lead">选你常去的集市，订阅到 iPhone 日历</p>
        <div class="location-row">
          <button class="location-button" id="locationButton" type="button">📍 使用当前位置</button>
          <p class="privacy-note">只在本地计算距离，不会保存。</p>
        </div>
      </section>

      <nav class="filters" id="filters" aria-label="集市筛选"></nav>

      <section class="market-list" id="marketList" aria-label="集市列表">
        <div class="empty">正在加载集市...</div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <section class="bottom-bar" id="bottomBar" aria-label="已选集市" hidden>
      <div class="bar-inner">
        <div>
          <p class="bar-count" id="barCount">已选 0 个集市</p>
          <p class="bar-sub">生成专属订阅日历</p>
        </div>
        <button class="subscribe-toggle" id="openPanelButton" type="button">订阅</button>
      </div>
    </section>

    <section class="subscribe-panel" id="subscribePanel" aria-label="订阅设置" hidden>
      <div class="panel-inner">
        <div class="panel-head">
          <p class="panel-title" id="panelTitle">已选 0 个集市</p>
          <button class="panel-close" id="closePanelButton" type="button" aria-label="收起订阅面板">×</button>
        </div>
        <div class="panel-actions">
          <button class="panel-button primary" id="subscribeButton" type="button">一键订阅 Apple 日历</button>
          <button class="panel-button secondary" id="copyButton" type="button">复制订阅链接</button>
        </div>
        <div class="link-row">
          <input id="httpsLink" type="text" readonly value="" aria-label="HTTPS 订阅链接">
        </div>
        <p class="panel-help" id="copyStatus">小红书或微信打不开时，复制链接到 iPhone 日历里手动添加订阅。</p>
      </div>
    </section>

    <script>
      const STORAGE_KEY = "dali-ganji-selected-markets";
      const PLACEHOLDER_IMAGE = "/images/markets/placeholder.jpg";
      const FILTERS = ["全部", "附近", "古城周边", "喜洲周边", "洱海北部", "洱海东部"];

      const marketList = document.querySelector("#marketList");
      const filters = document.querySelector("#filters");
      const locationButton = document.querySelector("#locationButton");
      const toast = document.querySelector("#toast");
      const bottomBar = document.querySelector("#bottomBar");
      const barCount = document.querySelector("#barCount");
      const openPanelButton = document.querySelector("#openPanelButton");
      const subscribePanel = document.querySelector("#subscribePanel");
      const panelTitle = document.querySelector("#panelTitle");
      const closePanelButton = document.querySelector("#closePanelButton");
      const subscribeButton = document.querySelector("#subscribeButton");
      const copyButton = document.querySelector("#copyButton");
      const httpsInput = document.querySelector("#httpsLink");
      const copyStatus = document.querySelector("#copyStatus");

      let markets = [];
      let selected = new Set();
      let activeFilter = "全部";
      let hasLocation = false;
      let toastTimer;

      init();

      async function init() {
        renderFilters();
        try {
          const response = await fetch(new URL("markets.json", window.location.href), { cache: "no-store" });
          if (!response.ok) throw new Error("markets.json load failed");
          markets = await response.json();
          selected = restoreSelection(markets);
          renderMarkets();
          updateSubscription();
        } catch (error) {
          marketList.innerHTML = '<div class="empty">集市列表加载失败，请稍后再试。</div>';
        }
      }

      function renderFilters() {
        filters.innerHTML = "";
        for (const filter of FILTERS) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = `filter-chip${activeFilter === filter ? " is-active" : ""}`;
          button.textContent = filter;
          button.addEventListener("click", () => {
            if (filter === "附近" && !hasLocation) {
              showToast("请先点击“使用当前位置”");
              return;
            }
            activeFilter = filter;
            renderFilters();
            renderMarkets();
          });
          filters.appendChild(button);
        }
      }

      function restoreSelection(allMarkets) {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
          const validIds = new Set(allMarkets.map((market) => market.id));
          return new Set(saved.filter((id) => validIds.has(id)));
        } catch (error) {
          return new Set();
        }
      }

      function renderMarkets() {
        const visibleMarkets = sortedMarkets();
        marketList.innerHTML = "";
        if (visibleMarkets.length === 0) {
          marketList.innerHTML = '<div class="empty">这里暂时没有收录集市。</div>';
          return;
        }

        const fragment = document.createDocumentFragment();
        for (const market of visibleMarkets) {
          const isSelected = selected.has(market.id);
          const card = document.createElement("article");
          card.className = `market-card${isSelected ? " is-selected" : ""}`;
          card.setAttribute("role", "button");
          card.setAttribute("tabindex", "0");
          card.setAttribute("aria-pressed", isSelected ? "true" : "false");
          card.innerHTML = cardTemplate(market, isSelected);
          card.addEventListener("click", () => toggleMarket(market.id));
          card.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              toggleMarket(market.id);
            }
          });
          fragment.appendChild(card);
        }
        marketList.appendChild(fragment);
      }

      function cardTemplate(market, isSelected) {
        const distance = market.distanceKm !== undefined ? formatDistance(market.distanceKm) : "";
        const areaLine = [market.area, distance].filter(Boolean).join(" · ");
        return `
          <div class="thumb">
            <img
              src="${escapeHtml(market.image || PLACEHOLDER_IMAGE)}"
              alt="${escapeHtml(market.image_alt || market.name)}"
              loading="lazy"
              onerror="this.onerror=null;this.src='${PLACEHOLDER_IMAGE}'"
            >
          </div>
          <div class="card-content">
            <div class="card-title-row">
              <h2 class="market-name">${escapeHtml(market.name)}</h2>
            </div>
            ${areaLine ? `<p class="meta">${escapeHtml(areaLine)}</p>` : ""}
            <p class="rule">${escapeHtml(trimScheduleText(market.schedule_text || "时间待补充"))}</p>
            <p class="place">${escapeHtml(market.address || market.location_name || "地点待补充")}</p>
          </div>
          <span class="select-mark" aria-hidden="true">${isSelected ? "✓" : "+"}</span>
        `;
      }

      function sortedMarkets() {
        let result = markets.slice();
        if (activeFilter !== "全部" && activeFilter !== "附近") {
          result = result.filter((market) => market.area === activeFilter);
        }
        if (hasLocation) {
          result.sort((a, b) => {
            const da = a.distanceKm ?? Number.POSITIVE_INFINITY;
            const db = b.distanceKm ?? Number.POSITIVE_INFINITY;
            if (da !== db) return da - db;
            return Number(a.order || 0) - Number(b.order || 0);
          });
        } else {
          result.sort((a, b) => Number(a.order || 0) - Number(b.order || 0));
        }
        return result;
      }

      function toggleMarket(marketId) {
        if (selected.has(marketId)) {
          selected.delete(marketId);
        } else {
          selected.add(marketId);
        }
        saveSelection();
        renderMarkets();
        updateSubscription();
      }

      function updateSubscription() {
        const ids = selectedIdsInMarketOrder();
        const hasSelection = ids.length > 0;
        const httpsUrl = hasSelection ? subscriptionUrl(ids, "https") : "";
        const webcalUrl = hasSelection ? subscriptionUrl(ids, "webcal") : "";

        bottomBar.hidden = !hasSelection;
        if (!hasSelection) subscribePanel.hidden = true;

        barCount.textContent = `已选 ${ids.length} 个集市`;
        panelTitle.textContent = `已选 ${ids.length} 个集市`;
        httpsInput.value = httpsUrl;
        httpsInput.dataset.url = httpsUrl;
        subscribeButton.dataset.url = webcalUrl;
        copyStatus.textContent = "小红书或微信打不开时，复制链接到 iPhone 日历里手动添加订阅。";
      }

      function selectedIdsInMarketOrder() {
        return markets.filter((market) => selected.has(market.id)).map((market) => market.id);
      }

      function subscriptionUrl(ids, protocol) {
        const baseUrl = window.location.protocol === "file:" ? "http://localhost:3000" : window.location.href;
        const url = new URL(`calendars/${ids.join("__")}.ics`, baseUrl);
        return protocol === "webcal" ? url.href.replace(/^https?:\/\//, "webcal://") : url.href;
      }

      function saveSelection() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(selectedIdsInMarketOrder()));
        } catch (error) {
          return;
        }
      }

      locationButton.addEventListener("click", async () => {
        locationButton.disabled = true;
        try {
          const position = await getUserLocation();
          const userLat = position.coords.latitude;
          const userLng = position.coords.longitude;
          markets = markets.map((market) => {
            if (!hasCoordinates(market)) return market;
            return {
              ...market,
              distanceKm: calculateDistanceKm(userLat, userLng, Number(market.lat), Number(market.lng)),
            };
          });
          hasLocation = true;
          activeFilter = "附近";
          renderFilters();
          renderMarkets();
          showToast("已按距离为你推荐附近集市");
        } catch (error) {
          showToast("无法获取位置，你仍然可以按区域手动选择");
        } finally {
          locationButton.disabled = false;
        }
      });

      openPanelButton.addEventListener("click", () => {
        subscribePanel.hidden = false;
      });

      closePanelButton.addEventListener("click", () => {
        subscribePanel.hidden = true;
      });

      subscribeButton.addEventListener("click", () => {
        const url = subscribeButton.dataset.url;
        if (url) window.location.href = url;
      });

      copyButton.addEventListener("click", async () => {
        const url = httpsInput.dataset.url;
        if (!url) return;
        try {
          await navigator.clipboard.writeText(url);
          copyStatus.textContent = "已复制订阅链接。";
        } catch (error) {
          httpsInput.focus();
          httpsInput.select();
          copyStatus.textContent = "请手动复制输入框里的链接。";
        }
      });

      function getUserLocation() {
        return new Promise((resolve, reject) => {
          if (!navigator.geolocation) {
            reject(new Error("Geolocation is not supported."));
            return;
          }
          navigator.geolocation.getCurrentPosition(resolve, reject, {
            enableHighAccuracy: false,
            timeout: 10000,
            maximumAge: 300000,
          });
        });
      }

      function calculateDistanceKm(lat1, lng1, lat2, lng2) {
        const earthRadiusKm = 6371;
        const dLat = toRadians(lat2 - lat1);
        const dLng = toRadians(lng2 - lng1);
        const a =
          Math.sin(dLat / 2) * Math.sin(dLat / 2) +
          Math.cos(toRadians(lat1)) *
            Math.cos(toRadians(lat2)) *
            Math.sin(dLng / 2) *
            Math.sin(dLng / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return earthRadiusKm * c;
      }

      function formatDistance(distanceKm) {
        if (!Number.isFinite(distanceKm)) return "";
        if (distanceKm < 1) return `距你 ${Math.round(distanceKm * 1000)} m`;
        return `距你 ${distanceKm.toFixed(1)} km`;
      }

      function hasCoordinates(market) {
        return market.lat !== null && market.lat !== undefined && market.lng !== null && market.lng !== undefined;
      }

      function showToast(message) {
        clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.add("is-visible");
        toastTimer = setTimeout(() => toast.classList.remove("is-visible"), 2400);
      }

      function toRadians(value) {
        return (value * Math.PI) / 180;
      }

      function trimScheduleText(value) {
        return String(value).replace(/赶集$/, "");
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
    </script>
  </body>
</html>
